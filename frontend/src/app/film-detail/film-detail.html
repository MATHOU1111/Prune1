<div class="detail-page">
  <div *ngIf="isLoading" class="state-msg">
    <span class="spinner"></span> Chargement...
  </div>
  <div *ngIf="errorMessage" class="state-msg error">{{ errorMessage }}</div>

  <div *ngIf="movie && !isLoading">
    <!-- Hero -->
    <div class="hero" [style.backgroundImage]="movie.posterUrl ? 'url(' + movie.posterUrl + ')' : 'none'">
      <div class="hero-overlay">
        <div class="hero-content">
          <button class="btn-back" (click)="goBack()">← Retour</button>
          <div class="badges">
            <span class="genre-badge" *ngIf="movie.genre">{{ movie.genre }}</span>
            <span class="year-badge" *ngIf="movie.year">{{ movie.year }}</span>
          </div>
          <h1>{{ movie.title }}</h1>
          <div class="rating" *ngIf="movie.rating">
            <span class="stars">⭐</span>
            <span class="score">{{ movie.rating }}<span class="max">/10</span></span>
          </div>
        </div>
      </div>
    </div>

    <!-- Body -->
    <div class="detail-body">
      <div class="poster-aside">
        <img *ngIf="movie.posterUrl" [src]="movie.posterUrl" [alt]="movie.title" />
        <div class="placeholder" *ngIf="!movie.posterUrl">🎬</div>
      </div>
      <div class="info">
        <p class="description" *ngIf="movie.description">{{ movie.description }}</p>
        <a class="imdb-link" *ngIf="movie.url" [href]="movie.url" target="_blank">
          🔗 Voir sur IMDb
        </a>
        <div class="dates">
          <span>Ajouté le {{ movie.createdAt | date:'dd/MM/yyyy' }}</span>
        </div>
      </div>
    </div>
  </div>
</div>
