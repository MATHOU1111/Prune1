<nav class="navbar">
  <span class="brand">🎬 Prune</span>
  <div class="nav-right">
    <span class="welcome" *ngIf="username">{{ username }}</span>
    <button class="btn-logout" (click)="logout()">Déconnexion</button>
  </div>
</nav>

<main class="container">
  <div class="page-header">
    <h1>Ma liste de films</h1>
    <span class="count" *ngIf="!isLoading">{{ movies.length }} films</span>
  </div>

  <div *ngIf="isLoading" class="state-msg">
    <span class="spinner"></span> Chargement...
  </div>
  <div *ngIf="errorMessage" class="state-msg error">{{ errorMessage }}</div>
  <div *ngIf="!isLoading && movies.length === 0 && !errorMessage" class="state-msg">
    Aucun film pour l'instant.
  </div>

  <div class="grid" *ngIf="!isLoading && movies.length > 0">
    <div class="card" *ngFor="let movie of movies" (click)="goToDetail(movie.id)">
      <div class="poster">
        <img *ngIf="movie.posterUrl" [src]="movie.posterUrl" [alt]="movie.title" loading="lazy" />
        <div class="poster-placeholder" *ngIf="!movie.posterUrl">🎬</div>
        <div class="genre-badge" *ngIf="movie.genre">{{ movie.genre }}</div>
      </div>
      <div class="card-body">
        <h2>{{ movie.title }}</h2>
        <div class="meta-row">
          <span class="year" *ngIf="movie.year">{{ movie.year }}</span>
          <span class="rating" *ngIf="movie.rating">⭐ {{ movie.rating }}</span>
        </div>
        <p class="desc" *ngIf="movie.description">{{ movie.description }}</p>
      </div>
    </div>
  </div>
</main>
