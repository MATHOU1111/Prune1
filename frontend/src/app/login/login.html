<div class="login-page">
  <div class="login-card">
    <div class="logo">
      <div class="logo-icon">🎬</div>
      <h1>Pru<span>ne</span></h1>
      <p>{{ isRegisterMode ? 'Créez votre compte' : 'Connectez-vous pour continuer' }}</p>
    </div>

    <form (ngSubmit)="submit()" #loginForm="ngForm">
      <div class="form-group">
        <label for="username">Nom d'utilisateur</label>
        <input
          id="username"
          type="text"
          [(ngModel)]="username"
          name="username"
          placeholder="Votre pseudo"
          autocomplete="username"
          required
        />
      </div>
      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input
          id="password"
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="••••••••"
          autocomplete="current-password"
          required
        />
      </div>

      <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

      <button type="submit" [disabled]="isLoading" class="btn-primary">
        {{ isLoading ? 'Chargement...' : (isRegisterMode ? 'Créer mon compte' : 'Se connecter') }}
      </button>
    </form>

    <p class="toggle-link">
      {{ isRegisterMode ? 'Déjà un compte ?' : 'Pas encore de compte ?' }}
      <button type="button" class="link-btn" (click)="toggleMode()">
        {{ isRegisterMode ? 'Se connecter' : 'S\'inscrire' }}
      </button>
    </p>
  </div>
</div>
